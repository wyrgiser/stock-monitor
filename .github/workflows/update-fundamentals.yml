name: Update fundamentals

on:
  schedule:
    - cron: '17 18 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Refresh ROE and dividend yield
        run: node scripts/update-fundamentals.mjs
      - name: Commit refreshed data
        run: |
          if git diff --quiet -- dist/stocks.json dist/fundamentals-meta.json; then
            echo "No fundamental-data changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/stocks.json dist/fundamentals-meta.json
          git commit -m "Update ROE and dividend yield"
          git push
